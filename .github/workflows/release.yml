name: Release

# The checks (ci.yml) unless main's CI already tested the code, then the build: kachelwerk.js is
# attached to the GitHub release, which HACS installs. Started by "Bump version" on its tag, or by
# a tag pushed from a checkout.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tested:
    uses: firsttris/workflows/.github/workflows/tested-on-main.yml@v1
    permissions:
      actions: read
      contents: read

  checks:
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [tested, checks]
    # The checks either passed or were not needed
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/kachelwerk.js

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: firsttris/workflows/.github/workflows/github-release.yml@v1
    with:
      release-artifact: release-files
      notes: |
        Install with HACS (custom repository, type Dashboard) or download `kachelwerk.js` below.
        See the [documentation](https://firsttris.github.io/kachelwerk/).
    permissions:
      contents: write
