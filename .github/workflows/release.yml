name: Release

# The checks (ci.yml), then the build: kachelwerk.js is attached to the GitHub release, which HACS
# installs. Started by "Bump version" on its tag, or by a tag pushed from a checkout.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/kachelwerk.js

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: firsttris/workflows/.github/workflows/github-release.yml@v1
    with:
      release-artifact: release-files
      notes: |
        Install with HACS (custom repository, type Dashboard) or download `kachelwerk.js` below.
        See the [documentation](https://firsttris.github.io/kachelwerk/).
    permissions:
      contents: write
