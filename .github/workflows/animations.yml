name: Update animations

# The moving pictures of the cards (docs/animations/*.webp), by hand only: an animation never comes
# out twice the same, so every run changes all of them. ffmpeg joins the frames into WebP.
on:
  workflow_dispatch:
    inputs:
      cards:
        description: Only these scenes, comma-separated (e.g. shutter,light); empty takes all
        type: string
        default: ""

jobs:
  animations:
    uses: firsttris/workflows/.github/workflows/screenshots.yml@v1
    with:
      # The Bun of packageManager in package.json, as setup-bun takes it in ci.yml; the image has
      # npm and node, but no unzip for Bun's installer and no jq (not the workflow's `bun-version`
      # input, which would be a second place for the version)
      install: >-
        apt-get update && apt-get install -y --no-install-recommends ffmpeg
        && npm install --global "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
        && bun install --frozen-lockfile
      lockfile: bun.lock
      command: ANIMATIONS="${{ inputs.cards }}" bun run animations
      paths: docs/animations
      commit-message: Update animations
    permissions:
      contents: write
