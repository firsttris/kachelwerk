name: CI

on:
  push:
    branches: [main]            # not every branch, pull requests build through pull_request
    paths-ignore: ["**.md", "docs/**", "LICENSE", "mkdocs.yml"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "mkdocs.yml"]
  workflow_call:                # release.yml runs the same checks before publishing
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The Bun of packageManager in package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: kachelwerk
          path: dist/kachelwerk.js
          retention-days: 7

  # What HACS checks before it lists a dashboard repository. HACS installs from the latest
  # release, so not while a release (a tag) is being built: its release doesn't exist yet
  hacs:
    if: ${{ !github.event.pull_request.draft && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # HACS's own docs use main; its last tagged release is from 2022
      - uses: hacs/action@main
        with:
          category: plugin
          # Brands are for integrations; a release only exists from the first tag on
          ignore: brands

  playwright-image:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.playwright.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: playwright
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  # Every card on the demo page, clicked through as a user would
  e2e:
    needs: playwright-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      # The npm package brings the binary without curl or unzip, which the image lacks. The image
      # has no jq; node reads the version from packageManager, in an assignment of its own so that
      # a failure stops the step instead of installing npm's latest Bun.
      - name: Set up Bun
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm install --global "bun@$version"
      - run: bun install --frozen-lockfile
      - name: Playwright
        env:
          HOME: /root
        run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
