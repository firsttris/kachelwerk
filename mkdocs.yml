site_name: Kachelwerk
site_description: Lovelace cards for Home Assistant that feel like an app, from the tiles of MUI
site_url: https://firsttris.github.io/kachelwerk/
repo_url: https://github.com/firsttris/kachelwerk
repo_name: firsttris/kachelwerk
edit_uri: edit/main/docs/
copyright: AGPL-3.0 · © Tristan Teufel and contributors
# installation.html instead of installation/, as the README links them
use_directory_urls: false
exclude_docs: |
  screenshots/README.md

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Installation: installation.md
  - Look and feel: appearance.md
  - Cards:
      - Shutter: cards/shutter.md
      - Light: cards/light.md
      - Thermostat: cards/thermostat.md
      - Floor heating: cards/floor.md
      - Window: cards/window.md
      - Garage door: cards/garage.md
      - Lock: cards/lock.md
      - Climate sensor: cards/climate-sensor.md
      - Meter: cards/meter.md
      - Sensor: cards/sensor.md
      - Detector: cards/detector.md
      - Valve: cards/valve.md
      - Buttons: cards/buttons.md
  - Development: development.md
